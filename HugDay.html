<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hug Day - For Radha ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="daily-page">
        <!-- Animation Container -->
        <div class="animation-container"></div>
        
        <!-- Content -->
        <div class="daily-content">
            <div class="name-animation">
                <span class="letter">R</span>
                <span class="letter">A</span>
                <span class="letter">D</span>
                <span class="letter">H</span>
                <span class="letter">A</span>
            </div>
            
            <h1 class="daily-title">🤗 Hug Day 🤗</h1>
            
            <p class="daily-message">
                If I could, I’d hold you right now 🤗💕<br>
                In your arms, I find peace, home, and courage.<br>
                Let me be your safe space, always.<br>
                Even when we’re apart, my heart is wrapped around yours.<br>
            </p>
            
            <a href="index.html" class="back-btn">← Back to Home</a>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        // Trigger hug animation
        document.addEventListener('DOMContentLoaded', function() {
            createHugAnimation();
            setInterval(createHugAnimation, 8000);
        });
    </script>
</body>
</html>
